# ==============================================================
# CONFIGURACION DE LA BASE DE DATOS (POSTGRESQL)
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_hotelera_db
spring.datasource.driver-class-name=org.postgresql.Driver

# Uso de variables de entorno con valores por defecto para seguridad
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_aqui}

# ==============================================================
# CONFIGURACION DE JPA / HIBERNATE
# ==============================================================
# Usamos 'validate' porque Flyway se encarga de crear las tablas
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL en la consola para depuracion
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# CONFIGURACION DE MIGRACIONES (FLYWAY)
# ==============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==============================================================
# CONFIGURACION DEL SERVIDOR
# ==============================================================
server.port=8081
spring.application.name=gestion-hotelera
