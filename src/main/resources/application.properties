# ==============================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (POSTGRESQL)
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_hotelera_db
spring.datasource.driver-class-name=org.postgresql.Driver

# Uso de variables de entorno con valores por defecto para seguridad
# Esto evita que tu contraseña real se filtre en GitHub
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_aqui}

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
# Usamos 'validate' porque Flyway se encargará de crear las tablas
# Hibernate solo verificará que tus entidades coincidan con la BD
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# CONFIGURACIÓN DE MIGRACIONES (FLYWAY)
# ==============================================================
# Esto asegura que Flyway busque los scripts en la carpeta que creaste
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==============================================================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
server.port=8081
spring.application.name=gestion-hotelera
